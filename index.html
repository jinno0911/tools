<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1f2328; --sub:#59636e; --accent:#0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --sub:#9198a1; --accent:#4493f8; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:1.6rem; margin:0 0 8px; }
  p { color:var(--sub); line-height:1.7; }
  .ok { display:inline-block; padding:4px 10px; border-radius:999px; background:var(--accent); color:#fff; font-size:.85rem; }
</style>
</head>
<body>
<main>
  <span class="ok">公開OK</span>
  <h1>Tools</h1>
  <p>GitHub Pagesの公開テスト用ページです。このページが表示されていれば、公開設定は完了しています。</p>
  <p>今後、作った道具はこのリポジトリに追加していきます。</p>
</main>
</body>
</html>
